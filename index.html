<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Трекер тренировок</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;

      /* Red-антагонист: два полюса — работа (зелёный) / отдых (красный).
         Оба приглушены, чтобы не давать «светофорного» свечения. */
      --accent: #2f8049;          /* работа — заливка/акцент */
      --accent-strong: #276b3d;   /* работа — нажатие */
      --accent-text: #5cbe85;     /* работа — текст на тёмном */

      --rest: #b3273f;            /* отдых — заливка/акцент */
      --rest-strong: #992036;     /* отдых — нажатие */
      --rest-text: #e0695c;       /* отдых — текст на тёмном (AA) */

      --brand-red: #b3223a;       /* бык, тире в подписи */

      --text: #e2e4e8;
      --text-muted: #9ca3af;
      --border: #333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 40px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border);
    }

    /* Карточка с параметрами упражнения — якорь для ссылки faq */
    .card--params {
      position: relative;
    }

    .faq-link {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 3px 8px;
      font-size: 10px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 0.4px;
      text-decoration: none;
      color: #6b7280;
      border: 1px solid #2c2c2c;
      border-radius: 5px;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .faq-link:hover {
      color: var(--text-muted);
      border-color: #454545;
    }

    .faq-link:active {
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .row {
      display: flex;
      gap: 10px;
    }

    .col {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
    }

    input {
      background: #2a2a2a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 16px;
      outline: none;
      width: 100%;
    }

    input:focus {
      border-color: var(--accent);
    }

    .timer-display {
      position: relative;
      text-align: center;
      padding: 28px 10px;
      border-radius: 12px;
      background: #181818;
      border: 1px solid var(--border);
    }

    .timer-status {
      position: relative;
      z-index: 1;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .timer-time {
      font-size: 64px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .state-idle .timer-status { color: var(--text-muted); }
    .state-work .timer-status { color: var(--accent-text); }
    .state-work .timer-time { color: var(--accent-text); }
    .state-rest .timer-status { color: var(--rest-text); }
    .state-rest .timer-time { color: var(--rest-text); }

    /* Рамка таймера подкрашивается под фазу */
    .state-work.timer-display { border-color: #2c4a3a; }
    .state-rest.timer-display { border-color: #4a2630; }

    button {
      border: none;
      border-radius: 12px;
      padding: 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, transform 0.05s, background-color 0.2s;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      background: #2a2a2a !important;
      color: #666 !important;
      cursor: not-allowed;
      border: 1px solid #333;
    }

    .btn-primary { background: var(--accent); color: #ffffff; width: 100%; }
    .btn-primary:active:not(:disabled) { background: var(--accent-strong); }
    /* Отдых — та же механика, но красный полюс */
    .btn-rest { background: var(--rest); color: #ffffff; width: 100%; }
    .btn-rest:active:not(:disabled) { background: var(--rest-strong); }
    .btn-secondary { background: #374151; color: var(--text); }

    .btn-finish {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: transparent;
      padding: 4px;
      border-radius: 4px;
      font-size: 20px;
      display: block;
      line-height: 1;
    }
    .btn-finish:active {
      background: rgba(255,255,255,0.1);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .log-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #262626;
      border-radius: 8px;
      font-size: 14px;
    }

    .log-meta {
      color: var(--text-muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn-small {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 6px;
    }

    /* ===== Splash (загрузочная анимация) ===== */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.55s ease, transform 0.55s ease, filter 0.55s ease;
    }

    .splash.hidden {
      opacity: 0;
      transform: scale(1.03);
      filter: blur(10px);
      pointer-events: none;
    }

    .splash-mark {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.7s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .splash-bull {
      width: 132px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.22));
      opacity: 0;
      transform-origin: 50% 50%;
      animation: bullIn 0.9s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes bullIn {
      0%   { opacity: 0; transform: scale(0.92); filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)); }
      60%  { opacity: 1; transform: scale(1.015); }
      100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.22)); }
    }

    /* Подпись */
    .splash-name {
      margin-top: 16px;
      font-size: 15.5px;
      letter-spacing: 6px;
      padding-left: 6px;
      text-transform: uppercase;
      font-weight: 700;
      color: #e2e4e8;
      white-space: nowrap;
      text-align: center;
    }

    .splash-name em {
      font-style: normal;
      color: var(--brand-red);
      margin: 0 2px;
    }

    /* Линия-«кнут»: растёт точно из центра под подписью */
    .splash-rule {
      position: relative;
      width: min(180px, 52vw);
      height: 1px;
      margin: 20px auto 0;
      background: var(--brand-red);
      transform: scaleX(0);
      transform-origin: 50% 50%;
      animation: ruleGrow 0.9s 0.45s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }

    /* Импульс, идущий от центра к краям */
    .splash-rule::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 1px;
      margin-top: -0.5px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      transform: translateX(-50%) scaleX(0);
      opacity: 0;
      animation: rulePulse 1.4s 1.35s ease-out forwards;
    }

    @keyframes ruleGrow {
      to { transform: scaleX(1); }
    }

    @keyframes rulePulse {
      0%   { opacity: 0; transform: translateX(-50%) scaleX(0); }
      35%  { opacity: 1; }
      100% { opacity: 0; transform: translateX(-50%) scaleX(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.3; }
    }

    /* ===== Появление контента после сплэша ===== */
    .container {
      transition: opacity 0.55s ease;
    }

    body.loading .container { opacity: 0; }

    .reveal {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      transition-delay: var(--d, 0ms);
    }

    body.loading .reveal {
      opacity: 0;
      transform: translateY(18px);
    }

    @media (prefers-reduced-motion: reduce) {
      .splash, .splash-mark, .splash-name, .splash-bull, .splash-rule,
      .splash-rule::after,
      .reveal, .container {
        animation: none !important;
        transition: none !important;
      }
      .splash-mark, .splash-bull { opacity: 1; }
      .splash-rule { transform: scaleX(1); }
      .splash-rule::after { display: none; }
    }
  </style>
</head>
<body class="loading">

  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-mark">
      <img class="splash-bull" src="074f14d11c010a6e4e43fba6e4aab9d4.png" alt="Быку – кнут">
      <div class="splash-name">Быку <em>–</em> Кнут</div>
      <div class="splash-rule"></div>
    </div>
  </div>

  <div class="container">
    <div class="card card--params reveal" style="--d: 60ms;">
      <a class="faq-link" href="faq.html" title="Справка">FAQ</a>
      <div class="col" style="margin-bottom: 12px;">
        <label>Упражнение</label>
        <input type="text" id="exerciseName" value="Жим лежа" placeholder="Название..." list="exercisesList">
        <datalist id="exercisesList"></datalist>
      </div>
      <div class="row">
        <div class="col">
          <label>Вес (кг)</label>
          <input type="number" id="weightInput" value="80" step="0.5">
        </div>
        <div class="col">
          <label>Повторы</label>
          <input type="number" id="repsInput" value="8" step="1">
        </div>
        <div class="col">
          <label>Отдых (сек)</label>
          <input type="number" id="targetRestInput" value="90" step="5">
        </div>
      </div>
    </div>

    <div class="timer-display state-idle reveal" id="timerBox" style="--d: 140ms;">
      <div class="timer-status" id="timerStatus">Готов к работе</div>
      <div class="timer-time" id="timerDigits">00:00</div>

      <button id="btnFinish" class="btn-finish" title="Завершить тренировку">🏁</button>
    </div>

    <div class="reveal" style="--d: 220ms;">
      <button id="btnMain" class="btn-primary">Начать подход</button>
    </div>

    <div class="card reveal" style="--d: 300ms;">
      <div class="actions-row">
        <label>История подходов</label>
        <div class="btn-group">
          <button id="btnExport" class="btn-secondary btn-small">Экспорт CSV</button>
          <button id="btnClear" class="btn-secondary btn-small" style="background: #4b2525;">Очистить</button>
        </div>
      </div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <script>
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playRestAlert() {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;
      [0, 0.2, 0.4].forEach((delay) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now + delay);
        gain.gain.setValueAtTime(0.3, now + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.12);
      });
    }

    let state = 'idle';
    let timerInterval = null;
    let workSeconds = 0;
    let restSeconds = 0;
    let lockSeconds = 0;
    let targetRestTime = 90;
    let setsHistory = JSON.parse(localStorage.getItem('workout_sets_v2') || '[]');

    const timerBox = document.getElementById('timerBox');
    const timerStatus = document.getElementById('timerStatus');
    const timerDigits = document.getElementById('timerDigits');
    const btnMain = document.getElementById('btnMain');
    const btnFinish = document.getElementById('btnFinish');
    const btnExport = document.getElementById('btnExport');
    const btnClear = document.getElementById('btnClear');
    const logList = document.getElementById('logList');
    const exerciseName = document.getElementById('exerciseName');
    const exercisesList = document.getElementById('exercisesList');
    const weightInput = document.getElementById('weightInput');
    const repsInput = document.getElementById('repsInput');
    const targetRestInput = document.getElementById('targetRestInput');

    function formatTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function updateExerciseAutocomplete() {
      const uniqueExercises = [...new Set(setsHistory.map(s => s.exercise))].filter(Boolean);
      exercisesList.innerHTML = uniqueExercises
        .map(ex => `<option value="${ex}">`)
        .join('');
    }

    function renderLogs() {
      logList.innerHTML = '';
      updateExerciseAutocomplete();
      setsHistory.slice().reverse().forEach((item) => {
        const div = document.createElement('div');
        div.className = 'log-item';

        let displayTime = '';
        if (item.timestamp) {
          const d = new Date(item.timestamp);
          const dateStr = `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
          const timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          displayTime = `${dateStr} ${timeStr}`;
        }

        div.innerHTML = `
          <div>
            <strong>${item.exercise}</strong>
            <div class="log-meta">${item.weight} кг × ${item.reps} повт. @ ${displayTime}</div>
          </div>
          <div style="text-align: right;">
            <div>Сет: ${item.workTime}с</div>
            <div class="log-meta">Отдых: ${item.restTime ? item.restTime + 'с' : '...'}</div>
          </div>
        `;
        logList.appendChild(div);
      });
    }

    function saveState() {
      localStorage.setItem('workout_sets_v2', JSON.stringify(setsHistory));
    }

    function resetToIdle() {
      state = 'idle';
      clearInterval(timerInterval);
      timerBox.className = 'timer-display state-idle';
      timerStatus.textContent = 'Готов к работе';
      timerDigits.textContent = '00:00';
      btnMain.textContent = 'Начать подход';
      btnMain.className = 'btn-primary';
      btnMain.disabled = false;
      workSeconds = 0;
      restSeconds = 0;
    }

    function startWork() {
      if (!exerciseName.value.trim()) {
        alert('Пожалуйста, введите название упражнения');
        return;
      }
      initAudio();
      if (state === 'rest' && setsHistory.length > 0) {
        setsHistory[setsHistory.length - 1].restTime = restSeconds;
      saveState();
      renderLogs();
      }

      state = 'work';
      workSeconds = 0;
      timerBox.className = 'timer-display state-work';
      timerStatus.textContent = 'Подход идет';
      timerDigits.textContent = formatTime(0);
      btnMain.textContent = 'Закончить подход';
      btnMain.className = 'btn-rest';
      btnMain.disabled = false;

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        workSeconds++;
        timerDigits.textContent = formatTime(workSeconds);
      }, 1000);
    }

    function startRest() {
      initAudio();
      const currentSet = {
        exercise: exerciseName.value.trim() || 'Без названия',
        weight: parseFloat(weightInput.value) || 0,
        reps: parseInt(repsInput.value, 10) || 0,
        workTime: workSeconds,
        restTime: null,
        timestamp: new Date().toISOString()
      };
      setsHistory.push(currentSet);
      saveState();
      renderLogs();

      state = 'rest';
      restSeconds = 0;
      lockSeconds = 30;
      targetRestTime = parseInt(targetRestInput.value, 10) || 90;

      timerBox.className = 'timer-display state-rest';
      timerStatus.textContent = 'Отдых';
      timerDigits.textContent = formatTime(0);

      btnMain.disabled = true;
      btnMain.textContent = 'Следующий подход';
      btnMain.className = 'btn-primary';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        restSeconds++;
        timerDigits.textContent = formatTime(restSeconds);

        if (lockSeconds > 0) {
          lockSeconds--;
          if (lockSeconds <= 0) {
            btnMain.disabled = false;
          }
        }

        if (restSeconds === targetRestTime) {
          playRestAlert();
        }

        if (restSeconds >= 1800) {
          resetToIdle();
        }
      }, 1000);
    }

    btnMain.addEventListener('click', () => {
      if (btnMain.disabled) return;
      if (state === 'idle' || state === 'rest') {
        startWork();
      } else if (state === 'work') {
        startRest();
      }
    });

    btnFinish.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Завершить тренировку?')) {
        if (state === 'rest' && setsHistory.length > 0) {
          setsHistory[setsHistory.length - 1].restTime = restSeconds;
          saveState();
          renderLogs();
        }
        resetToIdle();
      }
    });

    btnClear.addEventListener('click', () => {
      if (confirm('Вы уверены, что хотите полностью очистить историю подходов?')) {
        setsHistory = [];
        saveState();
        renderLogs();
      }
    });

    btnExport.addEventListener('click', () => {
      if (setsHistory.length === 0) return;
      const headers = ['Упражнение', 'Вес (кг)', 'Повторы', 'Время подхода (сек)', 'Отдых (сек)', 'Дата и время'];
      const rows = setsHistory.map(s => {
        const d = new Date(s.timestamp);
        const dateStr = d.getFullYear() + '-' +
                        String(d.getMonth() + 1).padStart(2, '0') + '-' +
                        String(d.getDate()).padStart(2, '0') + ' ' +
                        String(d.getHours()).padStart(2, '0') + ':' +
                        String(d.getMinutes()).padStart(2, '0') + ':' +
                        String(d.getSeconds()).padStart(2, '0');
        return [
          `"${s.exercise}"`,
          s.weight,
          s.reps,
          s.workTime,
          s.restTime || '',
          dateStr
        ];
      });
      const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement('a');
      link.setAttribute('href', encodedUri);
      link.setAttribute('download', `workout_${new Date().toISOString().slice(0, 10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    renderLogs();

    // ===== Загрузочная анимация =====
    (function initSplash() {
      const splash = document.getElementById('splash');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function finish() {
        splash.classList.add('hidden');
        document.body.classList.remove('loading');
        // Возвращаемся к началу страницы, чтобы поле «Упражнение» было в зоне видимости
        window.scrollTo({ top: 0, behavior: 'auto' });
        setTimeout(() => splash.remove(), 700);
      }

      // Браузер восстанавливает позицию скролла до загрузки — сбрасываем её
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }

      if (reduced) {
        finish();
        return;
      }

      // Сплэш показывается при каждой загрузке/перезагрузке страницы
      window.addEventListener('load', () => {
        window.scrollTo(0, 0);
        setTimeout(finish, 1900);
      });
      // Страховка, если load не сработает (например, кэш)
      setTimeout(finish, 3200);
    })();
  </script>
</body>
</html>
